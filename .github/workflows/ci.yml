name: Java CI/CD Pipeline & Code Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: "Build, Test & Verify Coverage (>80%)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-assignment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'java-assignment/pom.xml'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Tests and Enforce 80% Code Coverage
        run: ./mvnw clean test jacoco:check

      - name: Verify Package Build
        run: ./mvnw package -DskipTests

      - name: Publish Test Report & Coverage Summary
        if: always()
        run: |
          if [ -f "target/jacoco-report/jacoco.csv" ]; then
            echo "### JaCoCo Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Total | Missed | Covered | Coverage % |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            python3 -c "import csv; f=open('target/jacoco-report/jacoco.csv'); r=list(csv.DictReader(f)); ml=sum(int(x['LINE_MISSED']) for x in r); cl=sum(int(x['LINE_COVERED']) for x in r); mi=sum(int(x['INSTRUCTION_MISSED']) for x in r); ci=sum(int(x['INSTRUCTION_COVERED']) for x in r); tl=ml+cl; ti=mi+ci; print(f'| Lines | {tl} | {ml} | {cl} | {cl/tl*100:.2f}% |'); print(f'| Instructions | {ti} | {mi} | {ci} | {ci/ti*100:.2f}% |')" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/jacoco-report/
          retention-days: 14

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: java-assignment/target/surefire-reports/
          retention-days: 14
